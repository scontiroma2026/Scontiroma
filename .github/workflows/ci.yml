# Controllo automatico su ogni Pull Request e su main:
# il server deve installarsi e avviarsi, il sito deve compilare (stessi comandi di Render),
# e i test end-to-end devono passare contro un server e un MongoDB locali al runner.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Server (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Il server si importa senza errori
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: ci
          JWT_SECRET: ci-only-secret
        run: python -c "import server, email_service, paypal_service; print('ok')"
      - name: Test unitari (WebAuthn, dati riservati)
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: ci
          JWT_SECRET: ci-only-secret
        run: python -m pytest tests/test_webauthn_config.py tests/test_dati_riservati.py -o addopts="" -q -p no:cacheprovider

  frontend:
    name: Sito (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Build di produzione
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: https://api.scontiroma.it
        run: yarn build

  e2e:
    name: Test end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Database del runner, mai quello di produzione (server_e2e.py rifiuta host non locali).
      MONGO_URL: mongodb://localhost:27017
      # Facoltativo: chiave Stripe di TEST per il pagamento reale con la carta 4242.
      # Se il secret non esiste il valore è vuoto e quel test viene saltato.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Sito compilato per il server locale
        run: bash e2e/scripts/build-sito.sh
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test Playwright (flussi completi)
        working-directory: e2e
        run: npx playwright test
      - name: Test del server con il server di test avviato
        run: |
          python e2e/server_e2e.py &
          for i in $(seq 1 60); do curl -sf http://localhost:8001/api/ >/dev/null && break; sleep 1; done
          cd backend
          TEST_BASE_URL=http://localhost:8001 TEST_ADMIN_EMAIL=admin@example.com TEST_ADMIN_PASSWORD=e2e-admin-password \
            python -m pytest tests/test_legal_consent.py -o addopts="" -q -p no:cacheprovider
      - name: Nessuna risposta contiene campi riservati (server in-process, MongoDB del runner)
        working-directory: backend
        run: python -m pytest tests/test_campi_riservati_risposte.py -o addopts="" -q -p no:cacheprovider
      - name: Report Playwright (se qualcosa fallisce)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
