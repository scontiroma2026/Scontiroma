# Controllo automatico su ogni Pull Request e su main:
# il server deve installarsi e avviarsi, il sito deve compilare.
# Sono gli stessi comandi che usa Render: se qui è verde, il deploy parte.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Server (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Il server si importa senza errori
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: ci
          JWT_SECRET: ci-only-secret
        run: python -c "import server, email_service, paypal_service; print('ok')"

  frontend:
    name: Sito (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Build di produzione
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: https://api.scontiroma.it
        run: yarn build
