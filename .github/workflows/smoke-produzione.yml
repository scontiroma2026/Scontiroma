# Smoke test di SOLA LETTURA su https://scontiroma.it e https://api.scontiroma.it:
# nessun login, nessuna scrittura (GET/HEAD/OPTIONS, una visita alla home e un POST di logout
# senza essere collegati, che cancella solo cookie inesistenti).
name: Smoke produzione

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # ogni mattina (ora UTC)
  workflow_dispatch:
  pull_request:
    paths:
      - "e2e/tests/produzione/**"
      - "e2e/playwright.produzione.config.js"
      - ".github/workflows/smoke-produzione.yml"

jobs:
  smoke:
    name: Smoke produzione (sola lettura)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # serve a sapere quali cartelle (backend/, frontend/) ha cambiato l'unione
      # Dopo un'unione in main lo smoke partiva prima della fine del deploy su Render (falso rosso).
      # Ora aspetta, fino a 15 minuti, che server e sito riportino il commit appena unito.
      - name: Aspetta il deploy su Render del commit appena unito
        if: github.event_name == 'push'
        working-directory: .
        run: bash e2e/scripts/aspetta-deploy.sh "${{ github.sha }}" "${{ github.event.before }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.produzione.config.js
      - name: Report (se qualcosa fallisce)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: e2e/playwright-report
          retention-days: 7
